[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-validation"
version = "0.1.0"
description = "Validate GOV.UK prototypes against journey JSON contracts"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "requests>=2.28",
]
