<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Rate your experience - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/complete" method="post">
        <h1 class="govuk-heading-xl">Rate your experience</h1>
        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="satisfaction">
            How satisfied are you with our service?
          </label>
          <input class="govuk-input govuk-input--width-2" id="satisfaction" name="satisfaction"
                 type="text" pattern="^[1-5]$">
        </div>
        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--m" for="recommend">
            How likely are you to recommend us?
          </label>
          <input class="govuk-input govuk-input--width-2" id="recommend" name="recommend"
                 type="text" pattern="^[1-5]$">
        </div>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
