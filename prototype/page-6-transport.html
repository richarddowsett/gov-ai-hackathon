<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>What is your preferred transportation method? - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/page-6-transport" method="post">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <h1 class="govuk-fieldset__heading">What is your preferred transportation method?</h1>
          </legend>
          <div class="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="transport-public" name="transport" type="radio" value="Public Transport">
              <label class="govuk-label govuk-radios__label" for="transport-public">Public Transport</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="transport-personal" name="transport" type="radio" value="Personal Vehicle">
              <label class="govuk-label govuk-radios__label" for="transport-personal">Personal Vehicle</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="transport-bicycle" name="transport" type="radio" value="Bicycle">
              <label class="govuk-label govuk-radios__label" for="transport-bicycle">Bicycle</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="transport-walking" name="transport" type="radio" value="Walking">
              <label class="govuk-label govuk-radios__label" for="transport-walking">Walking</label>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
