<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>What is your date of birth? - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/page-3-license" method="post">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <h1 class="govuk-fieldset__heading">What is your date of birth?</h1>
          </legend>
          <div class="govuk-date-input" id="dob">
            <div class="govuk-date-input__item">
              <label class="govuk-label govuk-date-input__label" for="dob-day">Day</label>
              <input class="govuk-input govuk-date-input__input govuk-input--width-2"
                     id="dob-day" name="dob-day" type="text" inputmode="numeric">
            </div>
            <div class="govuk-date-input__item">
              <label class="govuk-label govuk-date-input__label" for="dob-month">Month</label>
              <input class="govuk-input govuk-date-input__input govuk-input--width-2"
                     id="dob-month" name="dob-month" type="text" inputmode="numeric">
            </div>
            <div class="govuk-date-input__item">
              <label class="govuk-label govuk-date-input__label" for="dob-year">Year</label>
              <input class="govuk-input govuk-date-input__input govuk-input--width-4"
                     id="dob-year" name="dob-year" type="text" inputmode="numeric">
            </div>
          </div>
        </fieldset>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
