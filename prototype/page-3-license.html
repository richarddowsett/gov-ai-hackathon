<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Do you have a driver's license? - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/page-3-license" method="post">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <h1 class="govuk-fieldset__heading">Do you have a driver's license?</h1>
          </legend>
          <div class="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="license-yes" name="license" type="radio" value="true">
              <label class="govuk-label govuk-radios__label" for="license-yes">Yes</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="license-no" name="license" type="radio" value="false">
              <label class="govuk-label govuk-radios__label" for="license-no">No</label>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
