<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>What type of vehicle do you own? - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/page-4-vehicle" method="post">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <h1 class="govuk-fieldset__heading">What type of vehicle do you own?</h1>
          </legend>
          <div class="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="vehicle-car" name="vehicle" type="radio" value="Car">
              <label class="govuk-label govuk-radios__label" for="vehicle-car">Car</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="vehicle-motorcycle" name="vehicle" type="radio" value="Motorcycle">
              <label class="govuk-label govuk-radios__label" for="vehicle-motorcycle">Motorcycle</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="vehicle-truck" name="vehicle" type="radio" value="Truck">
              <label class="govuk-label govuk-radios__label" for="vehicle-truck">Truck</label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="vehicle-other" name="vehicle" type="radio" value="Other">
              <label class="govuk-label govuk-radios__label" for="vehicle-other">Other</label>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
