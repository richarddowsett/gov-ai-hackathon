<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Select all vehicle features you have: - GOV.UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="govuk-template__body">
  <div class="govuk-width-container">
    <main class="govuk-main-wrapper" role="main">
      <form action="/page-7-rate" method="post">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
            <h1 class="govuk-fieldset__heading">Select all vehicle features you have:</h1>
          </legend>
          <div class="govuk-checkboxes">
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input" id="feature-gps" name="features" type="checkbox" value="GPS Navigation">
              <label class="govuk-label govuk-checkboxes__label" for="feature-gps">GPS Navigation</label>
            </div>
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input" id="feature-camera" name="features" type="checkbox" value="Backup Camera">
              <label class="govuk-label govuk-checkboxes__label" for="feature-camera">Backup Camera</label>
            </div>
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input" id="feature-cruise" name="features" type="checkbox" value="Cruise Control">
              <label class="govuk-label govuk-checkboxes__label" for="feature-cruise">Cruise Control</label>
            </div>
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input" id="feature-sunroof" name="features" type="checkbox" value="Sunroof">
              <label class="govuk-label govuk-checkboxes__label" for="feature-sunroof">Sunroof</label>
            </div>
            <div class="govuk-checkboxes__item">
              <input class="govuk-checkboxes__input" id="feature-heated" name="features" type="checkbox" value="Heated Seats">
              <label class="govuk-label govuk-checkboxes__label" for="feature-heated">Heated Seats</label>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="govuk-button">Continue</button>
      </form>
    </main>
  </div>
</body>
</html>
