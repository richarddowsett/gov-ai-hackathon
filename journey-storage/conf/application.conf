play.http.secret.key = "journey-storage-dev-secret-change-in-prod"

play.filters.hosts {
  allowed = ["."]
}

play.filters.enabled += play.filters.cors.CORSFilter
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = ["http://127.0.0.1:8787", "http://localhost:8787"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Origin"]
}

db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5433/journey"
db.default.username = "journey_user"
db.default.password = "journey_pass"
db.default.url = ${?JDBC_DATABASE_URL}
db.default.username = ${?JDBC_DATABASE_USERNAME}
db.default.password = ${?JDBC_DATABASE_PASSWORD}

play.evolutions.db.default.autoApply = true
