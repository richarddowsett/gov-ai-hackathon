services:
  json-creator:
    image: python:3.11-alpine
    working_dir: /workspace/json-creator
    command: ["python", "-m", "http.server", "8787", "--bind", "0.0.0.0"]
    volumes:
      - ./:/workspace:ro
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  prototype:
    image: python:3.11-alpine
    working_dir: /workspace
    command: ["python", "prototype/server.py", "4000", "0.0.0.0"]
    volumes:
      - ./:/workspace:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: journey
      POSTGRES_USER: journey_user
      POSTGRES_PASSWORD: journey_pass
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey_user -d journey"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
